name: utewedding

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-webthiep}
      POSTGRES_USER: ${DB_USER:-webthiep}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - utewedding-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-production}
      APP_ENVIRONMENT: ${APP_ENVIRONMENT:-production}
      FIELD_ENCRYPTION_ACTIVE_KEY_ID: ${FIELD_ENCRYPTION_ACTIVE_KEY_ID:?Set FIELD_ENCRYPTION_ACTIVE_KEY_ID}
      FIELD_ENCRYPTION_KEYS: ${FIELD_ENCRYPTION_KEYS:?Set FIELD_ENCRYPTION_KEYS}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-webthiep}
      DB_USER: ${DB_USER:-webthiep}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      FLYWAY_ENABLED: "true"
      APP_URL: ${APP_URL:-}
      FRONTEND_URL: ${FRONTEND_URL:-}
      PUBLIC_SITE_BASE_URL: ${PUBLIC_SITE_BASE_URL:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      WEBSOCKET_ALLOWED_ORIGINS: ${WEBSOCKET_ALLOWED_ORIGINS:-}
      TRUST_PROXY: ${TRUST_PROXY:-false}
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-}
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY?Set JWT_PRIVATE_KEY in .env or secret store}
      JWT_PUBLIC_KEYS: ${JWT_PUBLIC_KEYS?Set JWT_PUBLIC_KEYS in .env or secret store}
      AUDIT_IP_SALT: ${AUDIT_IP_SALT?Set AUDIT_IP_SALT in .env or secret store}
      JWT_ACTIVE_KID: ${JWT_ACTIVE_KID:-primary}
      JWT_ISSUER: ${JWT_ISSUER:-utewedding}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-utewedding-api}
      # __Host-wt_rt requires Secure; deployments must be served over HTTPS.
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      DATABASE_POOL_MAX: ${DB_POOL_SIZE:-20}
      DATABASE_POOL_MIN_IDLE: ${DB_MIN_IDLE:-2}
      MAIL_DRIVER: ${MAIL_DRIVER:-smtp}
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USER: ${MAIL_USER:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_SMTP_AUTH: ${MAIL_SMTP_AUTH:-true}
      MAIL_SMTP_STARTTLS: ${MAIL_SMTP_STARTTLS:-true}
      MAIL_SMTP_SSL: ${MAIL_SMTP_SSL:-false}
      MAIL_FROM: ${MAIL_FROM:-}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
      VNPAY_TMN_CODE: ${VNPAY_TMN_CODE:-}
      VNPAY_HASH_SECRET: ${VNPAY_HASH_SECRET:-}
      VNPAY_PAY_URL: ${VNPAY_PAY_URL:-}
      VNPAY_RETURN_URL: ${VNPAY_RETURN_URL:-}
      VNPAY_IPN_URL: ${VNPAY_IPN_URL:-}
      VNPAY_API_URL: ${VNPAY_API_URL:-}
      MOMO_PARTNER_CODE: ${MOMO_PARTNER_CODE:-}
      MOMO_ACCESS_KEY: ${MOMO_ACCESS_KEY:-}
      MOMO_SECRET_KEY: ${MOMO_SECRET_KEY:-}
      MOMO_ENDPOINT: ${MOMO_ENDPOINT:-}
      MOMO_QUERY_ENDPOINT: ${MOMO_QUERY_ENDPOINT:-}
      MOMO_REFUND_ENDPOINT: ${MOMO_REFUND_ENDPOINT:-}
      MOMO_RETURN_URL: ${MOMO_RETURN_URL:-}
      MOMO_IPN_URL: ${MOMO_IPN_URL:-}
      # Actuator listens on 8081 inside the Docker network. Do not publish it.
      MANAGEMENT_PORT: ${MANAGEMENT_PORT:-8081}
      MANAGEMENT_ADDRESS: ${MANAGEMENT_ADDRESS:-0.0.0.0}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:$${MANAGEMENT_PORT:-8081}/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 18

  kong:
    image: kong:3.7
    restart: unless-stopped
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /opt/kong/kong.yml
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: "off"
      KONG_SSL_CERT: /etc/kong/tls/fullchain.pem
      KONG_SSL_CERT_KEY: /etc/kong/tls/privkey.pem
    volumes:
      - ./kong.yml:/opt/kong/kong.yml:ro
      - ./tls/fullchain.pem:/etc/kong/tls/fullchain.pem:ro
      - ./tls/privkey.pem:/etc/kong/tls/privkey.pem:ro
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "${KONG_HTTPS_PORT:-8443}:8443"
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  utewedding-postgres:
