global:
  scrape_interval: 30s
  evaluation_interval: 30s
  external_labels:
    service: utewedding

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: utewedding-app
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["app:8081"]
  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]
  - job_name: backup
    static_configs:
      - targets: ["backup-metrics:9100"]
