app.environment=development
server.servlet.session.cookie.secure=false
app.url=${APP_URL:http://localhost:8080}
app.frontend-url=${FRONTEND_URL:http://localhost:3001}
app.public-site-base-url=${PUBLIC_SITE_BASE_URL:http://localhost:3001}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3001,http://localhost:3000}
app.websocket.allowed-origins=${WEBSOCKET_ALLOWED_ORIGINS:${CORS_ALLOWED_ORIGINS:http://localhost:3001,http://localhost:3000}}
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:${DB_PORT:5432}/${POSTGRES_DB:webthiep}}
spring.flyway.baseline-on-migrate=${FLYWAY_BASELINE_ON_MIGRATE:false}
security.jwt.allow-ephemeral=${JWT_ALLOW_EPHEMERAL:true}
security.audit.ip-salt=${AUDIT_IP_SALT:utewedding-local-audit-ip-salt-not-for-production}
mail.driver=${MAIL_DRIVER:noop}
vnpay.pay-url=${VNPAY_PAY_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
vnpay.return-url=${VNPAY_RETURN_URL:${APP_URL:http://localhost:8080}/payments/vnpay/return}
vnpay.ipn-url=${VNPAY_IPN_URL:${APP_URL:http://localhost:8080}/api/v1/payments/vnpay/ipn}
vnpay.api-url=${VNPAY_API_URL:https://sandbox.vnpayment.vn/merchant_webapi/api/transaction}
vnpay.environment=${VNPAY_ENVIRONMENT:SANDBOX}
momo.endpoint=${MOMO_ENDPOINT:https://test-payment.momo.vn/v2/gateway/api/create}
momo.query-endpoint=${MOMO_QUERY_ENDPOINT:https://test-payment.momo.vn/v2/gateway/api/query}
momo.refund-endpoint=${MOMO_REFUND_ENDPOINT:https://test-payment.momo.vn/v2/gateway/api/refund}
momo.environment=${MOMO_ENVIRONMENT:SANDBOX}
momo.return-url=${MOMO_RETURN_URL:http://localhost:8080/payments/momo/return}
momo.ipn-url=${MOMO_IPN_URL:http://localhost:8080/api/v1/payments/momo/ipn}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:false}
spring.mail.properties.mail.smtp.ssl.enable=${MAIL_SMTP_SSL:false}
