<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments :: head('Cảnh báo rủi ro · UTEWedding')}"></head>
<body class="bg-cream" th:classappend="${profileRole == 'MANAGER' or profileRole == 'ADMIN' or profileRole == 'SUPER_ADMIN'} ? ' admin-dashboard-page' : ''"><nav th:replace="~{fragments :: navbar}"></nav><main class="container py-5">
<div th:replace="~{operations/common :: messages}"></div>
<h1 class="h3">Cảnh báo rủi ro</h1><form method="get" class="row g-2 my-3"><div class="col-sm-6 col-lg-3"><select name="status" class="form-select"><option value="">Mọi trạng thái</option><option th:each="status : ${statuses}" th:value="${status}" th:text="${T(com.utewedding.app.service.web.StatusLabels).label(status)}" th:selected="${param.status != null and param.status[0] == status.name()}"></option></select></div><div class="col-sm-6 col-lg-3"><input class="form-control" name="rule" placeholder="Mã quy tắc" th:value="${param.rule}"></div><div class="col-sm-6 col-lg-2"><input class="form-control" name="from" placeholder="Từ ISO UTC" th:value="${param.from}"></div><div class="col-sm-6 col-lg-2"><input class="form-control" name="to" placeholder="Đến ISO UTC" th:value="${param.to}"></div><div class="col-12 col-lg-2"><button class="btn btn-dark w-100" type="submit">Lọc</button></div></form><p th:if="${rows.empty}" class="card p-4">Không có cảnh báo phù hợp.</p><div class="table-responsive" th:unless="${rows.empty}"><table class="table table-hover align-middle bg-white"><thead><tr><th class="text-center text-secondary" scope="col">STT</th><th>Quy tắc</th><th>Mức</th><th>Điểm</th><th>Trạng thái</th><th>Thời gian</th></tr></thead><tbody><tr th:each="row, rowStat : ${rows}"><td class="text-center text-secondary" th:text="${rows.number * rows.size + rowStat.count}">1</td><td><a th:href="@{/admin/risk-events/{id}(id=${row.id})}" th:text="${T(com.utewedding.app.service.web.StatusLabels).labelName(row.rule)}"></a></td><td th:text="${T(com.utewedding.app.service.web.StatusLabels).labelName(row.severity)}"></td><td th:text="${row.score}"></td><td th:text="${T(com.utewedding.app.service.web.StatusLabels).label(row.status)}"></td><td class="text-nowrap" th:text="${#temporals.format(row.createdAt, 'dd/MM/yyyy HH:mm')}"></td></tr></tbody></table></div><nav th:replace="~{operations/common :: pager(${rows})}"></nav>
</main><footer th:replace="~{fragments :: footer}"></footer><th:block th:replace="~{fragments :: scripts}"></th:block></body></html>
