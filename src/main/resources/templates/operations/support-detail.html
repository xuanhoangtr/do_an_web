<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments :: head('Hội thoại hỗ trợ · UTEWedding')}"></head>
<body class="bg-cream support-workspace" th:classappend="${staff} ? ' admin-dashboard-page' : ''">
<th:block th:if="${staff}"><nav th:replace="~{fragments :: adminnav('support')}"></nav></th:block>
<th:block th:unless="${staff}"><nav th:replace="~{fragments :: navbar}"></nav></th:block>
<main class="container py-5">
<div th:replace="~{operations/common :: messages}"></div>
<h1 class="h3" th:text="${ticket.number + ' · ' + ticket.subject}"></h1><p><span class="badge text-bg-light" th:text="${T(com.utewedding.app.service.web.StatusLabels).label(ticket.status)}"></span> <span class="badge text-bg-secondary" th:text="${T(com.utewedding.app.service.web.StatusLabels).label(ticket.priority)}"></span></p>
<p th:if="${ticket.orderId != null}"><a th:href="${(staff ? '/admin/orders/' : '/orders/') + ticket.orderId}">Xem đơn hàng liên quan</a></p>
<p th:if="${ticket.returnCaseId != null}"><a th:href="${(staff ? '/admin/returns/' : '/returns/') + ticket.returnCaseId}">Xem yêu cầu trả hàng liên quan</a></p>
<p th:if="${staff}" th:text="'Người phụ trách: ' + ${ticket.assigneeId == null ? 'Chưa phân công' : ticket.assigneeId}"></p>
<section th:each="message : ${ticket.messages}" th:if="${staff or message.visibility == 'CUSTOMER'}" class="card p-3 my-3"><div class="small text-secondary"><time class="text-nowrap" th:datetime="${message.createdAt}" th:text="${#temporals.format(message.createdAt, 'dd/MM/yyyy HH:mm')}"></time> · <span th:text="${message.visibility == 'INTERNAL' ? 'Ghi chú nội bộ' : 'Khách có thể xem'}"></span></div><p class="text-break mt-2" th:text="${message.body}" style="white-space: pre-wrap"></p><a th:each="mediaId : ${message.attachments}" class="me-3" th:href="${base + '/' + ticket.id + '/attachments/' + mediaId}">Tải đính kèm</a></section>
<p th:unless="${canReply}" class="alert alert-info">Ticket đã đóng hoặc đã quá 7 ngày sau khi xử lý. Vui lòng tạo ticket mới.</p>
<form th:if="${canReply}" th:action="${base + '/' + ticket.id + '/replies'}" method="post" enctype="multipart/form-data" class="card p-3"><input type="hidden" name="token" th:value="${token}"><label>Phản hồi<textarea name="body" class="form-control" required maxlength="5000" th:text="${savedBody}"></textarea></label><label th:if="${staff}"><input type="checkbox" name="internal" value="true"> Ghi chú nội bộ (khách không thấy)</label><label>Đính kèm<input type="file" name="files" multiple class="form-control"></label><button class="btn btn-dark mt-2" type="submit">Gửi phản hồi</button></form>
<form th:if="${staff}" th:action="${base + '/' + ticket.id + '/change'}" method="post" class="card p-3 my-3"><input type="hidden" name="token" th:value="${changeToken}"><label><input type="checkbox" name="claim" value="true"> Nhận việc</label><select name="status" class="form-select"><option value="">Giữ trạng thái</option><option th:each="status : ${statuses}" th:value="${status}" th:text="${status}"></option></select><select name="priority" class="form-select"><option value="">Giữ ưu tiên</option><option th:each="priority : ${priorities}" th:value="${priority}" th:text="${priority}"></option></select><button class="btn btn-dark" type="submit">Cập nhật</button></form>
<section th:if="${auditTrail != null}" class="mt-4"><h2 class="h5">Lịch sử thao tác</h2><ol><li th:each="event : ${auditTrail}"><time class="text-nowrap" th:datetime="${event.createdAt}" th:text="${#temporals.format(event.createdAt, 'dd/MM/yyyy HH:mm')}"></time><span th:text="${' · ' + event.actorId + ' · ' + T(com.utewedding.app.service.web.StatusLabels).labelName(event.action)}"></span></li></ol></section>
</main><footer th:replace="~{fragments :: footer}"></footer><th:block th:replace="~{fragments :: scripts}"></th:block></body></html>
