<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title} + ' - UTEWedding'">UTEWedding</title>
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/css/custom.css}">
</head>
<body>
    <nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-light bg-white shadow-sm">
        <div class="container">
            <a class="navbar-brand" th:href="@{/}">💍 UTEWedding</a>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" th:href="@{/}">Trang chủ</a></li>
                    <li class="nav-item"><a class="nav-link" th:href="@{/wedding/create}">Tạo Thiệp Cưới</a></li>
                    <li class="nav-item"><a class="nav-link" th:href="@{/shop/catalog}">Dịch Vụ Cưới</a></li>
                    <li class="nav-item"><a class="nav-link text-warning fw-semibold" th:href="@{/seller/onboarding}">Kênh Người Bán</a></li>
                    <li class="nav-item position-relative">
                        <a class="nav-link" th:href="@{/cart}">
                            🛒 Giỏ hàng
                            <span class="badge bg-danger rounded-pill" id="cartCountBadge" th:text="${cartItemCount ?: 0}">0</span>
                        </a>
                    </li>
                    <!-- Menu người dùng sau khi đăng nhập / chưa đăng nhập -->
                    <li class="nav-item" th:if="${#authentication == null or !#authorization.expression('isAuthenticated()')}">
                        <a class="nav-link" th:href="@{/auth/login}">Đăng nhập</a>
                    </li>
                    <li class="nav-item" th:if="${#authentication == null or !#authorization.expression('isAuthenticated()')}">
                        <a class="btn btn-outline-primary btn-sm ms-2 mt-1" th:href="@{/auth/register}">Đăng ký</a>
                    </li>
                    <li class="nav-item dropdown" th:if="${#authorization.expression('isAuthenticated()')}">
                        <a class="nav-link dropdown-toggle" href="#" id="userDropdown" role="button" data-bs-toggle="dropdown">
                            <span th:text="${#authentication.name}">Tài khoản</span>
                        </a>
                        <ul class="dropdown-menu dropdown-menu-end">
                            <li><a class="dropdown-item" th:href="@{/account/profile}">Hồ sơ cá nhân</a></li>
                            <li><a class="dropdown-item" th:href="@{/account/change-password}">Đổi mật khẩu</a></li>
                            <li><hr class="dropdown-divider"></li>
                            <li><a class="dropdown-item text-danger" th:href="@{/auth/logout}">Đăng xuất</a></li>
                        </ul>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
    <footer th:fragment="footer" class="py-4 bg-light text-center text-muted">
        <div class="container">
            <small>&copy; 2026 UTEWedding - Đồ Án Tốt Nghiệp Trường Đại học Sư phạm Kỹ thuật TP.HCM</small>
        </div>
    </footer>
</body>
</html>
