<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Đặt lại mật khẩu · UTEWedding')}"></head>
<body class="bg-cream">
<nav th:replace="~{fragments :: navbar}"></nav>
<main class="container py-5" style="max-width: 640px">
    <h1 class="display-subtitle">Đặt lại mật khẩu</h1>
    <p class="text-secondary">Dùng liên kết trong email hoặc mã OTP gồm 6 số. Mật khẩu mới thu hồi mọi phiên đăng nhập.</p>
    <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>
    <form th:action="@{/reset-password}" method="post" class="card border-0 shadow-sm p-4">
        <input type="hidden" name="token" th:value="${token}">
        <div class="mb-3"><label class="form-label" for="email">Email</label><input id="email" class="form-control" type="email" name="email" th:value="${email}" autocomplete="username"></div>
        <div class="mb-3"><label class="form-label" for="otp">Mã OTP</label><input id="otp" class="form-control" name="otp" inputmode="numeric" maxlength="6" autocomplete="one-time-code"></div>
        <div class="mb-3"><label class="form-label" for="newPassword">Mật khẩu mới</label><input id="newPassword" class="form-control" type="password" name="newPassword" minlength="10" required autocomplete="new-password"></div>
        <button class="btn btn-primary" type="submit">Đặt lại mật khẩu</button>
    </form>
</main>
<footer th:replace="~{fragments :: footer}"></footer>
<th:block th:replace="~{fragments :: scripts}"></th:block>
</body>
</html>
