<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Đăng ký · UTEWedding')}"></head>
<body class="bg-cream">
<nav th:replace="~{fragments :: navbar}"></nav>
<main class="container py-5">
    <div class="auth-card mx-auto card border-0 shadow-sm">
        <div class="card-body p-4 p-md-5">
            <p class="eyebrow">Join the circle</p>
            <h1 class="display-subtitle mt-2">Tạo tài khoản</h1>
            <p class="text-secondary">Lưu đơn hàng, địa chỉ và câu chuyện của bạn.</p>
            <form th:action="@{/register}" th:object="${registrationForm}" method="post" class="mt-4">
                <div th:if="${#fields.hasGlobalErrors()}" class="alert alert-danger border-0" role="alert" data-global-errors>
                    <p th:each="error : ${#fields.globalErrors()}" th:text="${error}"></p>
                </div>
                <div class="mb-3">
                    <label class="form-label" for="displayName">Họ và tên</label>
                    <input id="displayName" class="form-control" th:field="*{displayName}" th:classappend="${#fields.hasErrors('displayName')} ? ' is-invalid' : ''">
                    <div th:if="${#fields.hasErrors('displayName')}" class="invalid-feedback" th:errors="*{displayName}"></div>
                </div>
                <div class="mb-3">
                    <label class="form-label" for="username">Tên đăng nhập</label>
                    <input id="username" class="form-control" th:field="*{username}" th:classappend="${#fields.hasErrors('username')} ? ' is-invalid' : ''">
                    <div th:if="${#fields.hasErrors('username')}" class="invalid-feedback" th:errors="*{username}"></div>
                </div>
                <div class="mb-3">
                    <label class="form-label" for="email">Email</label>
                    <input id="email" type="email" autocomplete="email" class="form-control" th:field="*{email}" th:classappend="${#fields.hasErrors('email')} ? ' is-invalid' : ''">
                    <div th:if="${#fields.hasErrors('email')}" class="invalid-feedback" th:errors="*{email}"></div>
                </div>
                <div class="mb-3">
                    <label class="form-label" for="password">Mật khẩu</label>
                    <input id="password" type="password" class="form-control" th:field="*{password}" th:classappend="${#fields.hasErrors('password')} ? ' is-invalid' : ''">
                    <div th:if="${#fields.hasErrors('password')}" class="invalid-feedback" th:errors="*{password}"></div>
                </div>
                <div class="mb-3">
                    <label class="form-label" for="confirmPassword">Nhập lại mật khẩu</label>
                    <input id="confirmPassword" type="password" class="form-control" th:field="*{confirmPassword}" th:classappend="${#fields.hasErrors('confirmPassword')} ? ' is-invalid' : ''">
                    <div th:if="${#fields.hasErrors('confirmPassword')}" class="invalid-feedback" th:errors="*{confirmPassword}"></div>
                </div>
                <button class="btn btn-primary w-100" type="submit">Đăng ký</button>
            </form>
            <p class="small text-secondary mt-4 mb-0">Đã có tài khoản? <a th:href="@{/login}">Đăng nhập</a></p>
        </div>
    </div>
</main>
<footer th:replace="~{fragments :: footer}"></footer>
<th:block th:replace="~{fragments :: scripts}"></th:block>
</body>
</html>
