<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="_csrf" th:if="${_csrf != null}" th:content="${_csrf.token}">
    <meta name="_csrf_parameter" th:if="${_csrf != null}" th:content="${_csrf.parameterName}">
    <title>Đơn hàng · UTEWedding</title>
    <link rel="stylesheet" th:href="@{/css/be-vietnam-pro.css(v='font-20261027')}">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,300..700,0..1,0..1&amp;display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/custom.css(v='ui-fonts-20261027-v5')}">
    <link rel="stylesheet" th:href="@{/css/admin-dashboard.css(v='ui-layout-20261029-v5')}">
    <link rel="stylesheet" th:href="@{/css/vendor-workspace.css(v='vendor-layout-20261029-v2')}">
</head>
<body class="admin-dashboard-page vendor-workspace" id="top">
<aside th:replace="~{fragments/vendor-shell :: sidebar(${vendorNavActiveItem})}"></aside>
<button th:replace="~{fragments/vendor-shell :: backdrop}"></button>
<header th:replace="~{fragments/vendor-shell :: topbar(${vendorNavActiveItem})}"></header>
<main class="dash-content vendor-content">
  <a th:href="@{/vendor/orders}">Đơn hàng</a>
  <h1 th:text="${order.orderNumber}"></h1>
  <p>Trạng thái: <span th:text="${order.status}"></span> · Thanh toán: <span th:text="${order.paymentStatus}"></span></p>
  <section class="dash-card vendor-card-padded"><h2>Sản phẩm</h2>
    <ul><li th:each="item : ${order.items}"><span th:text="${item.name}"></span> × <span th:text="${item.quantity}"></span></li></ul>
    <h2>Chuẩn bị hàng</h2><ul><li th:each="status : ${order.fulfillments}" th:text="${status}"></li></ul>
    <form method="post" th:if="${order.paymentMethod == 'COD' and order.status.name() == 'PENDING' and order.paymentStatus.name() == 'PENDING' and !order.confirmed}" th:action="@{/vendor/orders/{id}/accept-cod(id=${order.id})}">
      <button class="btn btn-primary" type="submit">Xác nhận đơn COD</button>
      <p>Khách thanh toán khi nhận hàng.</p>
    </form>
    <form method="post" th:if="${(order.paymentMethod == 'COD' and order.confirmed and order.status.name() == 'PENDING' and order.paymentStatus.name() == 'PENDING') or (order.paymentMethod != 'COD' and order.status.name() == 'PAID' and order.paymentStatus.name() == 'SUCCEEDED')}" th:action="@{/vendor/orders/{id}/start-preparation(id=${order.id})}">
      <button class="btn btn-primary" type="submit">Bắt đầu chuẩn bị</button>
    </form>
  </section></main>
<footer th:replace="~{fragments :: footer}"></footer>
<th:block th:replace="~{fragments :: scripts}"></th:block>
<script th:src="@{/js/admin-dashboard-shell.js}" defer></script>
</body></html>
