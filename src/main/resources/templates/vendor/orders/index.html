<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="_csrf" th:if="${_csrf != null}" th:content="${_csrf.token}">
    <meta name="_csrf_parameter" th:if="${_csrf != null}" th:content="${_csrf.parameterName}">
    <title>Đơn hàng · UTEWedding</title>
    <link rel="stylesheet" th:href="@{/css/be-vietnam-pro.css(v='font-20261027')}">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,300..700,0..1,0..1&amp;display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/custom.css(v='ui-fonts-20261027-v5')}">
    <link rel="stylesheet" th:href="@{/css/admin-dashboard.css(v='ui-layout-20261029-v5')}">
    <link rel="stylesheet" th:href="@{/css/vendor-workspace.css(v='vendor-layout-20261029-v2')}">
</head>
<body class="admin-dashboard-page vendor-workspace" id="top">
<aside th:replace="~{fragments/vendor-shell :: sidebar(${vendorNavActiveItem})}"></aside>
<button th:replace="~{fragments/vendor-shell :: backdrop}"></button>
<header th:replace="~{fragments/vendor-shell :: topbar(${vendorNavActiveItem})}"></header>
<main class="dash-content vendor-content">
  <h1>Đơn hàng</h1>
  <a th:href="@{/vendor/orders/export(page=${orders.number})}">Xuất CSV trang này</a>
  <p th:if="${orders.empty}">Cửa hàng chưa có đơn hàng.</p>
  <section class="dash-card table-responsive" th:unless="${orders.empty}">
    <table class="table"><thead><tr><th>Mã đơn</th><th>Trạng thái</th><th>Thanh toán</th><th>Ngày tạo</th></tr></thead>
      <tbody><tr th:each="order : ${orders.content}">
        <td><a th:href="@{/vendor/orders/{id}(id=${order.id})}" th:text="${order.orderNumber}"></a></td>
        <td th:text="${order.status}"></td><td th:text="${order.paymentStatus}"></td><td th:text="${order.createdAt}"></td>
      </tr></tbody></table>
  </section>
  <nav aria-label="Phân trang đơn hàng">
    <a th:if="${orders.hasPrevious()}" th:href="@{/vendor/orders(page=${orders.number - 1})}">Trang trước</a>
    <a th:if="${orders.hasNext()}" th:href="@{/vendor/orders(page=${orders.number + 1})}">Trang sau</a>
  </nav></main>
<footer th:replace="~{fragments :: footer}"></footer>
<th:block th:replace="~{fragments :: scripts}"></th:block>
<script th:src="@{/js/admin-dashboard-shell.js}" defer></script>
</body></html>
