<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="_csrf" th:if="${_csrf != null}" th:content="${_csrf.token}">
    <meta name="_csrf_parameter" th:if="${_csrf != null}" th:content="${_csrf.parameterName}">
    <title th:text="${product == null ? 'Thêm sản phẩm' : 'Sửa sản phẩm'} + ' · UTEWedding'">Sản phẩm · UTEWedding</title>
    <link rel="stylesheet" th:href="@{/css/be-vietnam-pro.css(v='font-20261027')}">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,300..700,0..1,0..1&amp;display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/custom.css(v='ui-fonts-20261027-v5')}">
    <link rel="stylesheet" th:href="@{/css/admin-dashboard.css(v='ui-layout-20261029-v5')}">
    <link rel="stylesheet" th:href="@{/css/vendor-workspace.css(v='vendor-layout-20261029-v2')}">
</head>
<body class="admin-dashboard-page vendor-workspace" id="top">
<aside th:replace="~{fragments/vendor-shell :: sidebar(${vendorNavActiveItem})}"></aside>
<button th:replace="~{fragments/vendor-shell :: backdrop}"></button>
<header th:replace="~{fragments/vendor-shell :: topbar(${vendorNavActiveItem})}"></header>
<main class="dash-content vendor-content vendor-product-form-page">
    <div class="dash-heading vendor-heading">
        <div><span class="vendor-eyebrow">NỘI DUNG SẢN PHẨM</span>
            <h1 th:text="${product == null ? 'Thêm sản phẩm' : 'Chỉnh sửa sản phẩm'}">Thêm sản phẩm</h1>
            <p>Nội dung thay đổi sẽ cần được duyệt lại. Tồn kho và trạng thái duyệt không thể chỉnh tại biểu mẫu này.</p>
        </div><a class="btn btn-outline-dark" th:href="@{/vendor/products}">Quay lại danh sách</a>
    </div>
    <div th:if="${formError}" class="alert alert-danger" th:text="${formError}"></div>
    <div th:if="${#fields.hasGlobalErrors()}" class="alert alert-danger" th:each="error : ${#fields.globalErrors()}" th:text="${error.defaultMessage}"></div>
    <section th:if="${product != null}" class="dash-card mb-4 vendor-product-status-card">
        <strong>Trạng thái kiểm duyệt</strong>
        <span th:text="${product.moderationStatus.name() == 'APPROVED' ? 'Đã duyệt' : (product.moderationStatus.name() == 'BLOCKED' ? 'Đang bị chặn' : (product.moderationStatus.name() == 'REJECTED' ? 'Từ chối' : 'Chờ duyệt'))}">Chờ duyệt</span>
        <p th:if="${product.moderationReason != null}" th:text="${product.moderationReason}"></p>
    </section>
    <form th:action="${product == null ? '/vendor/products' : '/vendor/products/' + product.id}"
          th:object="${productForm}" method="post" enctype="multipart/form-data" class="dash-card vendor-product-editor">
        <input type="hidden" th:field="*{version}">
        <input type="hidden" th:field="*{managedMediaId}">
        <div class="row g-3">
            <div class="col-md-8"><label class="form-label" for="productName">Tên sản phẩm</label><input id="productName" class="form-control" th:field="*{name}" maxlength="120" required><div class="invalid-feedback d-block" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div></div>
            <div class="col-md-4"><label class="form-label" for="categoryId">Danh mục</label><select id="categoryId" class="form-select" th:field="*{categoryId}" required><option value="">Chọn danh mục</option><option th:each="category : ${productCategoryOptions}" th:value="${category.id}" th:text="${category.name}"></option></select><div class="invalid-feedback d-block" th:if="${#fields.hasErrors('categoryId')}" th:errors="*{categoryId}"></div></div>
            <div class="col-md-6"><label class="form-label" for="sku">SKU</label><input id="sku" class="form-control" th:field="*{sku}" maxlength="80" autocomplete="off"><div class="form-text">Để trống để hệ thống tự tạo SKU.</div></div>
            <div class="col-md-6"><label class="form-label" for="shortDescription">Mô tả ngắn</label><input id="shortDescription" class="form-control" th:field="*{shortDescription}" maxlength="500"></div>
            <div class="col-md-4"><label class="form-label" for="unitPrice">Giá bán (đ)</label><input id="unitPrice" class="form-control" type="number" min="0" th:field="*{unitPrice}" required></div>
            <div class="col-md-4"><label class="form-label" for="compareAtPrice">Giá gốc trước giảm (đ)</label><input id="compareAtPrice" class="form-control" type="number" min="0" step="0.01" th:field="*{compareAtPrice}"></div>
            <div class="col-md-4"><label class="form-label" for="discountPercent">Giảm giá (%)</label><input id="discountPercent" class="form-control" type="number" min="0" max="100" th:field="*{discountPercent}"></div>
            <div class="col-12"><label class="form-label" for="description">Mô tả</label><textarea id="description" class="form-control" rows="5" th:field="*{description}" maxlength="4000"></textarea></div>
            <div class="col-md-6"><label class="form-label" for="material">Chất liệu</label><input id="material" class="form-control" th:field="*{material}" maxlength="160"></div>
            <div class="col-md-6"><label class="form-label" for="customizationGuide">Hướng dẫn tùy chỉnh</label><input id="customizationGuide" class="form-control" th:field="*{customizationGuide}" maxlength="2000"></div>
            <div class="col-md-4"><label class="form-label" for="minOrderQuantity">Số lượng đặt tối thiểu</label><input id="minOrderQuantity" class="form-control" type="number" min="1" th:field="*{minOrderQuantity}" required></div>
            <div class="col-md-4"><label class="form-label" for="weightGrams">Khối lượng (gram)</label><input id="weightGrams" class="form-control" type="number" min="0" th:field="*{weightGrams}"></div>
            <div class="col-md-4"><label class="form-label" for="dimensions">Kích thước</label><input id="dimensions" class="form-control" th:field="*{dimensions}" maxlength="160"></div>
            <div class="col-md-6"><label class="form-label" for="image">Ảnh sản phẩm</label><input id="image" class="form-control" name="image" type="file" accept="image/*"><div class="form-text">Ảnh mới được gắn riêng với cửa hàng của bạn.</div>
                <img th:if="${product != null and product.imageUrl != null}" class="vendor-product-form-image mt-2" th:src="${product.imageUrl}" alt="Ảnh sản phẩm hiện tại"></div>
            <div class="col-md-6 d-flex align-items-end"><div class="form-check mb-2"><input class="form-check-input" id="customizable" type="checkbox" th:field="*{customizable}"><label class="form-check-label" for="customizable">Cho phép tùy chỉnh sản phẩm</label></div></div>
        </div>
        <div class="vendor-product-form-actions"><button class="btn btn-primary" type="submit" th:text="${product == null ? 'Gửi sản phẩm để duyệt' : 'Lưu và gửi duyệt lại'}">Lưu</button><a class="btn btn-outline-dark" th:href="@{/vendor/products}">Hủy</a></div>
    </form>
</main>
<footer th:replace="~{fragments :: footer}"></footer>
<th:block th:replace="~{fragments :: scripts}"></th:block>
<script th:src="@{/js/admin-dashboard-shell.js}" defer></script>
</body></html>
