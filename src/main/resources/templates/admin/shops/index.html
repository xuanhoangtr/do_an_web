<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Quản lý cửa hàng · UTEWedding')}"></head>
<body class="admin-dashboard-page admin-dashboard-wrapped-layout" id="top">
<div class="dash-layout">
    <aside th:replace="~{fragments :: adminSidebar('shops')}"></aside>
    <button type="button" class="dash-sidebar-backdrop" id="dashboardSidebarBackdrop" aria-label="Đóng menu"></button>
    <div class="dash-main">
        <header th:replace="~{fragments :: adminTopbar('shops')}"></header>
        <main class="dash-content">
            <div class="dash-heading"><div><h1>Quản lý cửa hàng</h1><p>Xét duyệt hồ sơ và quản lý trạng thái cửa hàng nhà bán.</p></div></div>
            <div class="alert alert-success" role="status" th:if="${successMessage}" th:text="${successMessage}"></div>
            <div class="alert alert-danger" role="alert" th:if="${errorMessage}" th:text="${errorMessage}"></div>

            <form method="get" th:action="@{/admin/shops}" class="dash-card dash-panel mb-4">
                <div class="row g-3 align-items-end">
                    <div class="col-12 col-md-6 col-xl-5"><label class="form-label" for="shop-search">Tìm cửa hàng</label><input id="shop-search" class="form-control" name="q" th:value="${q}" maxlength="100" placeholder="Tên, mã hoặc đường dẫn"></div>
                    <div class="col-12 col-md-4 col-xl-3"><label class="form-label" for="shop-status">Trạng thái</label><select id="shop-status" class="form-select" name="status"><option value="">Tất cả</option><option th:each="state : ${statuses}" th:value="${state.name()}" th:selected="${state == selectedStatus}" th:text="${statusLabels[state.name()]}">Trạng thái</option></select></div>
                    <div class="col-12 col-md-6 col-xl-4 admin-filter-actions"><button class="dash-button dash-button-primary flex-grow-1" type="submit">Lọc</button><a class="dash-button dash-button-outline" th:href="@{/admin/shops}">Xóa lọc</a></div>
                </div>
            </form>

            <section class="dash-card dash-panel p-0 overflow-hidden" aria-labelledby="shops-list-title">
                <div class="dash-section-head p-4 mb-0"><div><h2 id="shops-list-title">Cửa hàng nhà bán</h2><p th:text="${shops.totalElements + ' cửa hàng'}">0 cửa hàng</p></div></div>
                <div class="table-responsive">
                    <table class="table align-middle mb-0">
                        <thead class="table-light"><tr><th class="text-center">STT</th><th>Cửa hàng</th><th>Mã cửa hàng</th><th>Trạng thái</th><th>Cập nhật</th><th>Thao tác</th></tr></thead>
                        <tbody>
                        <tr th:each="shop,rowStat : ${shops.content}">
                            <td class="text-center text-secondary" th:text="${shops.number * shops.size + rowStat.count}">1</td>
                            <td><strong th:text="${shop.displayName}">Cửa hàng</strong><small class="d-block text-secondary" th:text="${shop.slug}">slug</small></td>
                            <td th:text="${shop.code}">VND-...</td>
                            <td><span class="badge rounded-pill" th:classappend="${shop.status.name() == 'ACTIVE' ? ' text-bg-success' : shop.status.name() == 'PENDING' ? ' text-bg-warning' : shop.status.name() == 'REJECTED' ? ' text-bg-danger' : ' text-bg-secondary'}" th:text="${statusLabels[shop.status.name()]}">Chờ xét duyệt</span></td>
                            <td><time th:if="${shop.updatedAt != null}" th:text="${#temporals.format(shop.updatedAt, 'dd/MM/yyyy HH:mm')}">—</time><span th:unless="${shop.updatedAt != null}">—</span></td>
                            <td><a class="btn btn-sm btn-outline-primary" th:href="@{/admin/shops/{id}(id=${shop.id})}">Xem hồ sơ</a></td>
                        </tr>
                        <tr th:if="${shops.empty}"><td colspan="6" class="p-5 text-center text-secondary">Không tìm thấy cửa hàng phù hợp.</td></tr>
                        </tbody>
                    </table>
                </div>
                <nav th:if="${shops.totalPages > 1}" class="p-3" aria-label="Phân trang cửa hàng">
                    <ul class="pagination justify-content-center mb-0">
                        <li class="page-item" th:classappend="${shops.first ? 'disabled' : ''}"><a class="page-link" th:href="@{/admin/shops(page=${shops.number - 1},q=${q},status=${selectedStatus})}">‹</a></li>
                        <li class="page-item disabled"><span class="page-link" th:text="${shops.number + 1 + ' / ' + shops.totalPages}">1 / 1</span></li>
                        <li class="page-item" th:classappend="${shops.last ? 'disabled' : ''}"><a class="page-link" th:href="@{/admin/shops(page=${shops.number + 1},q=${q},status=${selectedStatus})}">›</a></li>
                    </ul>
                </nav>
            </section>
        </main>
    </div>
</div>
<th:block th:replace="~{fragments :: scripts}"></th:block>
<script th:src="@{/js/admin-dashboard-shell.js}" defer></script>
</body>
</html>
