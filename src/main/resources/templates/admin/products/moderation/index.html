<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments :: head('Kiểm duyệt sản phẩm nhà bán · UTEWedding')}"></head>
<body class="bg-cream admin-dashboard-page">
<nav th:replace="~{fragments :: adminnav('products')}"></nav>
<main class="container py-5">
    <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-end gap-3 mb-4">
        <div><p class="eyebrow">NHÀ BÁN</p><h1 class="display-subtitle mt-2 mb-0">Kiểm duyệt sản phẩm</h1></div>
        <a class="btn btn-outline-dark rounded-pill" th:href="@{/admin/products}">Quản lý sản phẩm nền tảng</a>
    </div>
    <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
    <form class="card border-0 shadow-sm p-3 mb-4" method="get" th:action="@{/admin/products/moderation}">
        <div class="row g-2 align-items-end"><div class="col-md-9"><label class="form-label" for="status">Trạng thái kiểm duyệt</label><select class="form-select" id="status" name="status"><option th:each="status : ${statuses}" th:value="${status}" th:selected="${selectedStatus == status}" th:text="${statusLabels[status]}">Chờ duyệt</option></select></div><div class="col-md-3"><button class="btn btn-dark w-100" type="submit">Lọc</button></div></div>
    </form>
    <div th:if="${products.empty}" class="card border-0 shadow-sm p-5 text-center">Không có sản phẩm ở trạng thái này.</div>
    <div th:unless="${products.empty}" class="card border-0 shadow-sm overflow-hidden"><div class="table-responsive">
        <table class="table align-middle mb-0"><thead class="table-light"><tr><th class="text-center">STT</th><th>Sản phẩm</th><th>Cửa hàng</th><th>Giá</th><th>Trạng thái</th><th>Cập nhật</th><th></th></tr></thead>
            <tbody><tr th:each="product, row : ${products.content}"><td class="text-center text-secondary" th:text="${products.number * products.size + row.count}">1</td>
                <td><strong th:text="${product.name}">Sản phẩm</strong><small class="d-block text-secondary" th:text="${product.sku}">SKU</small></td><td th:text="${product.shopName}">Cửa hàng</td>
                <td class="text-nowrap" th:text="${#numbers.formatDecimal(product.unitPrice,0,'COMMA',0,'POINT')} + ' đ'">0 đ</td><td th:text="${statusLabels[product.moderationStatus]}">Chờ duyệt</td>
                <td class="text-nowrap" th:text="${#temporals.format(product.updatedAt, 'dd/MM/yyyy HH:mm')}">28/10/2026</td>
                <td><a class="btn btn-sm btn-outline-dark" th:href="@{/admin/products/moderation/{id}(id=${product.id})}">Xem xét</a></td></tr></tbody>
        </table></div></div>
    <nav th:if="${products.totalPages > 1}" class="mt-4" aria-label="Phân trang"><ul class="pagination justify-content-center"><li class="page-item" th:classappend="${products.first ? ' disabled' : ''}"><a class="page-link" th:href="@{/admin/products/moderation(page=${products.number - 1},status=${selectedStatus})}">‹</a></li><li class="page-item disabled"><span class="page-link" th:text="${products.number + 1 + ' / ' + products.totalPages}">1 / 1</span></li><li class="page-item" th:classappend="${products.last ? ' disabled' : ''}"><a class="page-link" th:href="@{/admin/products/moderation(page=${products.number + 1},status=${selectedStatus})}">›</a></li></ul></nav>
</main>
<footer th:replace="~{fragments :: footer}"></footer><th:block th:replace="~{fragments :: scripts}"></th:block>
</body></html>
