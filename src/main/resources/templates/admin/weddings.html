<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Kiểm duyệt thiệp cưới · UTEWedding')}"></head>
<body class="bg-cream admin-dashboard-page"><nav th:replace="~{fragments :: adminnav('weddings')}"></nav>
<main class="container py-5">
    <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}" data-flash-success></div><div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>
    <p class="eyebrow">Nội dung cộng đồng</p><h1 class="display-subtitle">Kiểm duyệt thiệp cưới</h1>
    <form method="get" th:action="@{/admin/weddings}" class="card border-0 shadow-sm rounded-4 p-3 mt-4 mb-4"><div class="row g-2 align-items-end">
        <div class="col-md-6"><label class="form-label" for="wedding-q">Slug hoặc tiêu đề thiệp</label><input id="wedding-q" class="form-control" name="q" th:value="${q}" placeholder="Tìm thiệp"></div>
        <div class="col-md-4"><label class="form-label" for="wedding-status">Trạng thái</label><select id="wedding-status" class="form-select" name="status"><option value="">Tất cả trạng thái</option><option th:each="item : ${statuses}" th:value="${item}" th:text="${T(com.utewedding.app.service.web.StatusLabels).label(item)}" th:selected="${item.name() == status}"></option></select></div>
        <div class="col-md-2"><button class="btn btn-dark w-100" type="submit">Lọc</button></div>
    </div></form>
    <section class="card border-0 shadow-sm rounded-4 overflow-hidden">
        <div class="p-3 border-bottom d-flex justify-content-between align-items-center"><h2 class="h6 mb-0">Danh sách thiệp</h2><span class="badge text-bg-light" th:if="${weddings != null}" th:text="${weddings.totalElements + ' thiệp'}">0</span></div>
        <div class="table-responsive"><table class="table align-middle mb-0"><thead class="table-light"><tr><th class="text-center text-secondary" scope="col">STT</th><th class="ps-3">Thiệp</th><th>Chủ sở hữu</th><th>Trạng thái</th><th>Ngày cập nhật</th><th class="pe-3">Kiểm duyệt</th></tr></thead>
            <tbody><tr th:each="wedding, rowStat : ${weddings}" th:with="owner=${weddingOwners[wedding.ownerId]}">
                <td class="text-center text-secondary" th:text="${weddings.number * weddings.size + rowStat.count}">1</td>
                <td class="ps-3"><strong th:text="${wedding.internalTitle ?: wedding.slug ?: 'Thiệp chưa đặt tên'}">Thiệp</strong><small class="d-block text-secondary" th:text="${'/' + wedding.slug}"></small><a th:if="${wedding.previewToken != null}" th:href="@{/preview/{token}(token=${wedding.previewToken})}" target="_blank" rel="noopener">Xem trước</a></td>
                <td><strong th:text="${owner != null ? owner.displayName : 'Tài khoản không còn tồn tại'}"></strong><small class="d-block text-secondary" th:text="${owner != null and owner.email != null ? owner.email : wedding.ownerId}"></small></td>
                <td><span class="badge rounded-pill" th:classappend="${T(com.utewedding.app.service.web.StatusLabels).badgeClass(wedding.status)}" th:text="${T(com.utewedding.app.service.web.StatusLabels).label(wedding.status)}"></span></td>
                <td class="small text-secondary" th:text="${#temporals.format(wedding.updatedAt, 'dd/MM/yyyy HH:mm')}"></td>
                <td class="pe-3" style="min-width:300px">
                    <form th:if="${wedding.status.name() != 'SUSPENDED' and wedding.status.name() != 'ARCHIVED'}" th:action="@{/admin/weddings/{id}/suspend(id=${wedding.id})}" method="post" data-confirm-title="Tạm ngưng thiệp cưới" data-confirm-label="Tạm ngưng thiệp" data-confirm-message="Thiệp sẽ bị gỡ khỏi trang công khai. Kiểm tra kỹ nội dung và lý do trước khi xác nhận.">
                        <label class="form-label small" th:for="${'suspend-reason-' + wedding.id}">Lý do vi phạm (ít nhất 10 ký tự)</label><textarea class="form-control form-control-sm mb-2" th:id="${'suspend-reason-' + wedding.id}" name="reason" minlength="10" maxlength="1000" rows="2" required placeholder="Bản quyền, nội dung không phù hợp…"></textarea><button class="btn btn-sm btn-warning" type="submit">Tạm ngưng</button>
                    </form>
                    <form th:if="${wedding.status.name() == 'SUSPENDED'}" th:action="@{/admin/weddings/{id}/restore(id=${wedding.id})}" method="post" data-confirm-title="Khôi phục thiệp" data-confirm-label="Khôi phục" data-confirm-tone="success" data-confirm-message="Thiệp sẽ trở lại trạng thái trước khi bị tạm ngưng."><button class="btn btn-sm btn-outline-success" type="submit">Khôi phục</button></form>
                    <button class="btn btn-sm btn-outline-dark mt-2" type="button" data-bs-toggle="collapse" th:attr="data-bs-target=${'#wedding-feedback-' + wedding.id},aria-controls=${'wedding-feedback-' + wedding.id}" aria-expanded="false">Góp ý</button>
                    <div class="collapse mt-2" th:id="${'wedding-feedback-' + wedding.id}">
                        <form class="card card-body gap-2" th:action="@{/admin/weddings/{id}/feedback(id=${wedding.id})}" method="post" enctype="multipart/form-data">
                            <input type="hidden" name="token" th:value="${feedbackTokens[wedding.id]}">
                            <label class="form-label small mb-0" th:for="${'feedback-subject-' + wedding.id}">Tiêu đề</label>
                            <input class="form-control form-control-sm" name="subject" maxlength="200" th:id="${'feedback-subject-' + wedding.id}" value="Góp ý về thiệp cưới" required>
                            <label class="form-label small mb-0" th:for="${'feedback-body-' + wedding.id}">Nội dung góp ý</label>
                            <textarea class="form-control form-control-sm" name="body" maxlength="5000" rows="3" th:id="${'feedback-body-' + wedding.id}" required></textarea>
                            <label class="form-label small mb-0" th:for="${'feedback-files-' + wedding.id}">Tệp đính kèm</label>
                            <input class="form-control form-control-sm" type="file" name="files" multiple th:id="${'feedback-files-' + wedding.id}">
                            <button class="btn btn-sm btn-primary align-self-start" type="submit">Gửi góp ý qua ticket</button>
                        </form>
                    </div>
                </td>
            </tr><tr th:if="${weddings == null or weddings.empty}"><td colspan="6" class="p-5 text-center text-secondary">Không có thiệp phù hợp bộ lọc.</td></tr></tbody>
        </table></div>
    </section>
    <nav th:if="${weddings != null and weddings.totalPages > 1}" class="mt-4" aria-label="Phân trang thiệp"><ul class="pagination justify-content-center"><li class="page-item" th:classappend="${weddings.first ? ' disabled' : ''}"><a class="page-link" th:href="@{/admin/weddings(page=${weddings.number - 1},q=${q},status=${status})}">‹</a></li><li class="page-item disabled"><span class="page-link" th:text="${weddings.number + 1 + ' / ' + weddings.totalPages}">1 / 1</span></li><li class="page-item" th:classappend="${weddings.last ? ' disabled' : ''}"><a class="page-link" th:href="@{/admin/weddings(page=${weddings.number + 1},q=${q},status=${status})}">›</a></li></ul></nav>
</main>
<footer th:replace="~{fragments :: footer}"></footer><th:block th:replace="~{fragments :: scripts}"></th:block><script th:src="@{/js/marketplace-admin.js}" defer></script>
</body>
</html>
