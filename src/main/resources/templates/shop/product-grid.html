<th:block xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" th:fragment="grid">
    <div th:each="product : ${products}" class="col-12 col-sm-6 col-lg-4">
        <article class="card product-card h-100 border-0 shadow-sm">
            <a th:href="@{/products/{id}(id=${product.slug})}" class="product-image-wrap product-image-large">
                <img th:if="${product.imageUrl != null and !#strings.isEmpty(product.imageUrl)}" th:src="${product.imageUrl}" th:alt="${product.name}">
                <div th:unless="${product.imageUrl != null and !#strings.isEmpty(product.imageUrl)}" class="product-placeholder" aria-hidden="true">♡</div>
            </a>
            <div class="card-body p-4 d-flex flex-column">
                <div class="d-flex justify-content-between gap-2"><span class="badge bg-light text-dark" th:text="${product.category}">Quà cưới</span><span class="small text-secondary text-nowrap">★ <span th:text="${product.rating}">5.0</span> (<span th:text="${product.reviewCount}">0</span>)</span></div>
                <h3 class="h5 mt-3"><a class="text-dark text-decoration-none" th:href="@{/products/{id}(id=${product.slug})}" th:text="${product.name}">Sản phẩm</a></h3>
                <p class="small mb-0"><a th:if="${product.shopSlug != null}" class="text-secondary text-decoration-none"
                    th:href="@{/shops/{slug}(slug=${product.shopSlug})}" th:text="${product.shopName}">Cửa hàng</a>
                    <span th:unless="${product.shopSlug != null}" class="text-secondary" th:text="${product.shopName}">UTEWedding</span></p>
                <p class="small text-secondary" th:text="${product.description}">Mô tả sản phẩm</p>
                <div class="d-flex justify-content-between align-items-end gap-2 mt-auto pt-3"><div><strong class="fs-5 text-primary text-nowrap" th:text="${#numbers.formatDecimal(product.unitPrice,0,'COMMA',0,'POINT')} + ' đ'">0 đ</strong><del th:if="${product.originalPrice != null and product.originalPrice.compareTo(product.unitPrice) > 0}" class="d-block small text-secondary text-nowrap" th:text="${#numbers.formatDecimal(product.originalPrice,0,'COMMA',0,'POINT')} + ' đ'"></del><small th:if="${product.discountPercent > 0}" class="d-block text-danger text-nowrap" th:text="${'Giảm ' + product.discountPercent + '%'}"></small></div>
                    <form sec:authorize="hasAnyRole('USER','CUSTOMER')" th:if="${product.photoSizeOptions.empty}" th:action="@{/cart/add}" method="post" data-cart-action="add"><input type="hidden" name="productId" th:value="${product.id}"><input type="hidden" name="quantity" th:value="${product.minOrderQuantity}"><button class="btn btn-sm btn-outline-dark rounded-pill" type="submit" th:disabled="${product.inventory < product.minOrderQuantity}"><span th:text="${product.inventory < product.minOrderQuantity ? 'Hết hàng' : 'Thêm vào giỏ'}">Thêm vào giỏ</span></button></form>
                    <a sec:authorize="hasAnyRole('USER','CUSTOMER')" th:if="${!product.photoSizeOptions.empty}" class="btn btn-sm btn-outline-dark rounded-pill text-nowrap" th:href="@{/products/{id}(id=${product.slug})}">Chọn kích thước</a>
                    <a sec:authorize="!isAuthenticated()" class="btn btn-sm btn-outline-dark rounded-pill text-nowrap" th:href="@{/login}">Đăng nhập để mua hàng</a>
                    <span sec:authorize="isAuthenticated() and !hasAnyRole('USER','CUSTOMER')" class="small text-secondary">Dành cho khách hàng</span>
                </div>
                <a class="small text-secondary text-decoration-none mt-3" th:href="@{/products/{id}(id=${product.slug})}">Xem chi tiết →</a>
            </div>
        </article>
    </div>
</th:block>
