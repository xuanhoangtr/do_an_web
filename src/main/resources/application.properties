# Cấu hình Spring Boot 3.3 - UTEWedding
spring.application.name=utewedding-app
server.port=8080

# Cấu hình Cơ sở dữ liệu PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/utewedding_db
spring.datasource.username=utewedding_user
spring.datasource.password=utewedding_secret_2026
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Flyway Migration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# Placeholder cấu hình giao vận nội bộ
utewedding.shipping.mode=standard-fixed-rate
utewedding.shipping.fixed-amount=30000
