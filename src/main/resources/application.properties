# UTE Wedding - Spring Boot baseline configuration
spring.application.name=${APP_NAME:webthiep}
spring.main.banner-mode=off
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.encoding=UTF-8
spring.web.resources.static-locations=classpath:/static/
spring.web.resources.chain.strategy.content.enabled=true
spring.web.resources.chain.strategy.content.paths=/**

# Runtime
app.environment=${APP_ENVIRONMENT:${NODE_ENV:development}}
app.api-prefix=${API_PREFIX:api/v1}
app.url=${APP_URL:}
app.frontend-url=${FRONTEND_URL:}
app.public-site-base-url=${PUBLIC_SITE_BASE_URL:}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}
app.trust-proxy=${TRUST_PROXY:false}
app.swagger.enabled=${SWAGGER_ENABLED:true}
app.swagger.path=${SWAGGER_PATH:api/docs}
# WebSocket origins follow the HTTP CORS allowlist unless an operator explicitly
# supplies a separate WebSocket allowlist.
app.websocket.allowed-origins=${WEBSOCKET_ALLOWED_ORIGINS:${CORS_ALLOWED_ORIGINS:}}
app.notifications.shipper-user-id=${NOTIFICATION_SHIPPER_USER_ID:}
app.marketplace.enabled=${MARKETPLACE_ENABLED:false}
app.marketplace.onboarding.enabled=${MARKETPLACE_ONBOARDING_ENABLED:false}
app.marketplace.vendor-management.enabled=${MARKETPLACE_VENDOR_MANAGEMENT_ENABLED:false}
app.marketplace.vendor-orders.enabled=${MARKETPLACE_VENDOR_ORDERS_ENABLED:false}
app.marketplace.checkout.enabled=${MARKETPLACE_CHECKOUT_ENABLED:false}
app.marketplace.grouped-checkout.enabled=${MARKETPLACE_GROUPED_CHECKOUT_ENABLED:false}
app.marketplace.multi-shop-cart.enabled=${MARKETPLACE_MULTI_SHOP_CART_ENABLED:false}
app.marketplace.shop-chat.enabled=${MARKETPLACE_SHOP_CHAT_ENABLED:false}
app.marketplace.shop-vouchers.enabled=${MARKETPLACE_SHOP_VOUCHERS_ENABLED:false}
app.marketplace.payout.enabled=${MARKETPLACE_PAYOUT_ENABLED:false}
shipping.base-fee=${SHIPPING_BASE_FEE:0}
shipping.default-provider=${SHIPPING_DEFAULT_PROVIDER:INTERNAL}
shipping.internal-province-codes=${SHIPPING_INTERNAL_PROVINCE_CODES:79}
shipping.providers.external.webhook-secret=${SHIPPING_PROVIDER_WEBHOOK_SECRET:}
ghn.token=${GHN_TOKEN:}
ghn.shop-id=${GHN_SHOP_ID:0}
ghn.webhook-secret=${GHN_WEBHOOK_SECRET:}
ghn.pickup-province-id=${GHN_PICKUP_PROVINCE_ID:1000001}
ghn.pickup-ward-id=${GHN_PICKUP_WARD_ID:}
ghn.default-weight-grams=${GHN_DEFAULT_WEIGHT_GRAMS:1000}
ghn.default-length-cm=${GHN_DEFAULT_LENGTH_CM:20}
ghn.default-width-cm=${GHN_DEFAULT_WIDTH_CM:15}
ghn.default-height-cm=${GHN_DEFAULT_HEIGHT_CM:10}
finance.media-retention-days=${FINANCE_MEDIA_RETENTION_DAYS:2555}
security.risk.hmac-secret=${RISK_HMAC_SECRET:local-risk-secret-change-me}
media.cleanup.fixed-delay-ms=${MEDIA_CLEANUP_FIXED_DELAY_MS:60000}
support.auto-close-cron=${SUPPORT_AUTO_CLOSE_CRON:0 15 * * * *}
orders.expiry.fixed-delay-ms=${ORDERS_EXPIRY_FIXED_DELAY_MS:60000}
orders.expiry.initial-delay-ms=${ORDERS_EXPIRY_INITIAL_DELAY_MS:60000}
orders.payment.vnpay-unpaid-ttl=${ORDERS_PAYMENT_VNPAY_UNPAID_TTL:24h}

# The migration blueprint uses the standard PostgreSQL port. Override DB_PORT,
# DB_USER, DB_PASSWORD, or POSTGRES_DB when using the existing compose mapping.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:${DB_PORT:5432}/${POSTGRES_DB:webthiep}}
spring.datasource.username=${DB_USER:}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=${DATABASE_POOL_MAX:10}
spring.datasource.hikari.minimum-idle=${DATABASE_POOL_MIN_IDLE:2}
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.session.store-type=jdbc
spring.session.jdbc.initialize-schema=never

# Versioned PostgreSQL schema. Existing non-empty databases are baselined at
# V1, while a new database runs the complete V1 baseline followed by later
# migrations. Tests explicitly disable Flyway when using H2.
spring.flyway.enabled=${FLYWAY_ENABLED:true}
spring.flyway.baseline-on-migrate=${FLYWAY_BASELINE_ON_MIGRATE:false}
spring.flyway.baseline-version=1
spring.flyway.locations=classpath:db/migration
# Use session-level PostgreSQL migration locks so non-transactional
# CREATE INDEX CONCURRENTLY migrations do not wait on Flyway's own lock transaction.
spring.flyway.postgresql.transactional-lock=false
spring.sql.init.mode=never

# Required runtime port for the Java application.
server.port=8080
server.servlet.context-path=/
# Keep browser redirects on the original HTTPS origin when TLS ends at a proxy.
server.tomcat.use-relative-redirects=true
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${SERVER_SESSION_COOKIE_SECURE:true}
server.servlet.session.cookie.same-site=${SERVER_SESSION_COOKIE_SAME_SITE:Lax}
# Client addresses and proxy TLS scheme are resolved only by TrustedClientIpFilter
# after checking the socket peer. Keep Spring and Tomcat from rewriting that peer first.
server.forward-headers-strategy=none
app.trusted-proxy-cidrs=${TRUSTED_PROXY_CIDRS:127.0.0.1/32,::1/128}
spring.servlet.multipart.max-file-size=${MAX_IMAGE_SIZE:10485760}
spring.servlet.multipart.max-request-size=${MAX_IMAGE_SIZE:10485760}
# Wedding/vendor editors contain more than ten fields, including CSRF and files.
# Keep a finite limit; request/file byte limits and per-part header limits still apply.
server.tomcat.max-part-count=${MAX_MULTIPART_PARTS:50}
server.tomcat.max-swallow-size=${MAX_IMAGE_SIZE:10485760}

# Legacy Node settings retained as explicit migration properties.
legacy.node.port=${PORT:3000}
legacy.body-limit=${BODY_LIMIT:1mb}
legacy.database-url=${DATABASE_URL:}
legacy.direct-database-url=${DIRECT_DATABASE_URL:}

# Authentication and cookies
# No symmetric-secret fallback: production must receive the active RSA key and
# a public verification ring from a secret manager or mounted secret files.
security.jwt.private-key=${JWT_PRIVATE_KEY:}
security.jwt.public-keys=${JWT_PUBLIC_KEYS:}
security.jwt.active-kid=${JWT_ACTIVE_KID:primary-2026}
security.jwt.allow-ephemeral=${JWT_ALLOW_EPHEMERAL:false}
security.jwt.access-ttl=${JWT_ACCESS_TTL:15m}
security.jwt.issuer=${JWT_ISSUER:webthiep}
security.jwt.audience=${JWT_AUDIENCE:webthiep-api}
security.refresh-token.ttl=${REFRESH_TOKEN_TTL:30d}
security.refresh-token.cookie-name=${REFRESH_TOKEN_COOKIE_NAME:__Host-wt_rt}
security.cookie.secure=${COOKIE_SECURE:true}
security.cookie.same-site=${COOKIE_SAME_SITE:Strict}
security.csrf.enabled=${CSRF_ENABLED:true}
security.email-verification.ttl=${EMAIL_VERIFICATION_TTL:10m}
security.email-verification.resend-cooldown=${EMAIL_VERIFICATION_RESEND_COOLDOWN:60s}
security.email-verification.max-sends-per-hour=${EMAIL_VERIFICATION_MAX_SENDS_PER_HOUR:5}
security.email-verification.rate-limit-window=${EMAIL_VERIFICATION_RATE_LIMIT_WINDOW:1h}
security.email-verification.rate-limit-key=${EMAIL_VERIFICATION_RATE_LIMIT_KEY:${SECURITY_AUDIT_IP_SALT:utewedding-local}}
security.email-verification.rate-limit-cleanup-cron=${EMAIL_VERIFICATION_RATE_LIMIT_CLEANUP_CRON:0 17 * * * *}
security.password-reset.ttl=${PASSWORD_RESET_TTL:1h}
security.cleanup.cron=${SECURITY_CLEANUP_CRON:0 0 3 * * *}
security.cleanup.batch-size=${SECURITY_CLEANUP_BATCH_SIZE:1000}
security.cleanup.max-batches-per-run=${SECURITY_CLEANUP_MAX_BATCHES_PER_RUN:100}
security.cleanup.auth-session-retention=${AUTH_SESSION_CLEANUP_RETENTION:30d}
security.cleanup.password-reset-retention=${PASSWORD_RESET_CLEANUP_RETENTION:1d}
security.cleanup.email-verification-retention=${EMAIL_VERIFICATION_CLEANUP_RETENTION:1d}
security.audit.ip-salt=${AUDIT_IP_SALT}
security.field-encryption.active-key-id=${FIELD_ENCRYPTION_ACTIVE_KEY_ID:}
security.field-encryption.keys=${FIELD_ENCRYPTION_KEYS:}

# Argon2id migration settings
security.argon2.memory-cost=${ARGON2_MEMORY_COST:19456}
security.argon2.time-cost=${ARGON2_TIME_COST:2}
security.argon2.parallelism=${ARGON2_PARALLELISM:1}

# Legacy S3-compatible settings are retained only for configuration compatibility.
# Java media uploads are Cloudinary-only; the default cannot fall back to MinIO/S3.
storage.driver=${STORAGE_DRIVER:cloudinary}
storage.s3.endpoint=${S3_ENDPOINT:http://localhost:9000}
storage.s3.region=${S3_REGION:us-east-1}
storage.s3.bucket=${S3_BUCKET:webthiep-media}
storage.s3.access-key=${S3_ACCESS_KEY:}
storage.s3.secret-key=${S3_SECRET_KEY:}
storage.s3.force-path-style=${S3_FORCE_PATH_STYLE:true}
storage.s3.public-base-url=${S3_PUBLIC_BASE_URL:http://localhost:9000/webthiep-media}
storage.s3.presign-expiry=${S3_PRESIGN_EXPIRY:900}

# Cloudinary SaaS configuration. Never use MinIO/S3 for Java media uploads.
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}

# VNPay Sandbox configuration. VNPAY_HASH_SECRET is the HMAC-SHA512 secret.
vnpay.tmn-code=${VNPAY_TMN_CODE:}
vnpay.hash-secret=${VNPAY_HASH_SECRET:}
vnpay.pay-url=${VNPAY_PAY_URL:}
vnpay.return-url=${VNPAY_RETURN_URL:}
vnpay.ipn-url=${VNPAY_IPN_URL:}
vnpay.api-url=${VNPAY_API_URL:}
vnpay.environment=${VNPAY_ENVIRONMENT:}
vnpay.version=${VNPAY_VERSION:2.1.0}
vnpay.command=${VNPAY_COMMAND:pay}
vnpay.currency=${VNPAY_CURRENCY:VND}
vnpay.locale=${VNPAY_LOCALE:vn}
vnpay.expire-minutes=${VNPAY_EXPIRE_MINUTES:15}

# MoMo test/sandbox configuration. Secrets must be supplied at runtime.
momo.partner-code=${MOMO_PARTNER_CODE:}
momo.access-key=${MOMO_ACCESS_KEY:}
momo.secret-key=${MOMO_SECRET_KEY:}
momo.endpoint=${MOMO_ENDPOINT:}
momo.query-endpoint=${MOMO_QUERY_ENDPOINT:}
momo.refund-endpoint=${MOMO_REFUND_ENDPOINT:}
momo.return-url=${MOMO_RETURN_URL:}
momo.ipn-url=${MOMO_IPN_URL:}
momo.environment=${MOMO_ENVIRONMENT:}

payments.reconciliation.initial-delay-ms=${PAYMENTS_RECONCILIATION_INITIAL_DELAY_MS:120000}
payments.reconciliation.fixed-delay-ms=${PAYMENTS_RECONCILIATION_FIXED_DELAY_MS:300000}

# Media limits
media.max-image-size=${MAX_IMAGE_SIZE:10485760}
media.max-image-width=${MAX_IMAGE_WIDTH:6000}
media.max-image-height=${MAX_IMAGE_HEIGHT:6000}
media.max-wedding-images=${MAX_WEDDING_IMAGES:100}
media.thumbnail-width=${THUMBNAIL_WIDTH:480}
media.thumbnail-height=${THUMBNAIL_HEIGHT:480}

# Mail
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USER:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:false}
spring.mail.properties.mail.smtp.ssl.enable=${MAIL_SMTP_SSL:false}
mail.driver=${MAIL_DRIVER:smtp}
mail.from=${MAIL_FROM:webthiep <no-reply@thiep.local>}
mail.secure=${MAIL_SECURE:false}

# Rate limiting (TTL in seconds, limit in requests)
rate-limit.cache.maximum-size=${RATE_LIMIT_MAX_ENTRIES:10000}
rate-limit.cache.expire-after-access-seconds=${RATE_LIMIT_CACHE_EXPIRE_SECONDS:3600}
rate-limit.global.ttl=${RATE_LIMIT_GLOBAL_TTL:60}
rate-limit.global.limit=${RATE_LIMIT_GLOBAL_LIMIT:120}
rate-limit.login.ttl=${RATE_LIMIT_LOGIN_TTL:300}
rate-limit.login.limit=${RATE_LIMIT_LOGIN_LIMIT:5}
rate-limit.register.ttl=${RATE_LIMIT_REGISTER_TTL:3600}
rate-limit.register.limit=${RATE_LIMIT_REGISTER_LIMIT:5}
rate-limit.forgot-password.ttl=${RATE_LIMIT_FORGOT_PASSWORD_TTL:3600}
rate-limit.forgot-password.limit=${RATE_LIMIT_FORGOT_PASSWORD_LIMIT:5}
rate-limit.reset-password.ttl=${RATE_LIMIT_RESET_PASSWORD_TTL:3600}
rate-limit.reset-password.limit=${RATE_LIMIT_RESET_PASSWORD_LIMIT:5}
rate-limit.refresh.ttl=${RATE_LIMIT_REFRESH_TTL:60}
rate-limit.refresh.limit=${RATE_LIMIT_REFRESH_LIMIT:30}
rate-limit.slug-check.ttl=${RATE_LIMIT_SLUG_CHECK_TTL:60}
rate-limit.slug-check.limit=${RATE_LIMIT_SLUG_CHECK_LIMIT:30}
rate-limit.guest-link.ttl=${RATE_LIMIT_GUEST_LINK_TTL:60}
rate-limit.guest-link.limit=${RATE_LIMIT_GUEST_LINK_LIMIT:30}
rate-limit.rsvp.ttl=${RATE_LIMIT_RSVP_TTL:3600}
rate-limit.rsvp.limit=${RATE_LIMIT_RSVP_LIMIT:10}
rate-limit.wish.ttl=${RATE_LIMIT_WISH_TTL:3600}
rate-limit.wish.limit=${RATE_LIMIT_WISH_LIMIT:5}
rate-limit.upload.ttl=${RATE_LIMIT_UPLOAD_TTL:3600}
rate-limit.upload.limit=${RATE_LIMIT_UPLOAD_LIMIT:60}
rate-limit.public.ttl=${RATE_LIMIT_PUBLIC_TTL:60}
rate-limit.public.limit=${RATE_LIMIT_PUBLIC_LIMIT:100}

# Observability. The management port is separate from the public app port so Kong
# cannot route Actuator. Local runs bind it to loopback; Compose sets
# MANAGEMENT_ADDRESS=0.0.0.0 on the internal Docker network only.
management.server.port=${MANAGEMENT_PORT:8081}
management.server.address=${MANAGEMENT_ADDRESS:127.0.0.1}
management.endpoints.web.base-path=/actuator
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.probes.add-additional-paths=false
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.readiness.include=readinessState,db,diskSpace
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true
management.health.mail.enabled=false
management.endpoint.heapdump.enabled=false
management.endpoint.env.enabled=false
management.endpoint.configprops.enabled=false
management.endpoint.threaddump.enabled=false
management.endpoint.logfile.enabled=false
management.endpoint.loggers.enabled=false
management.endpoint.shutdown.enabled=false
management.httpexchanges.recording.enabled=false
management.info.env.enabled=true
management.metrics.tags.application=${spring.application.name}
management.metrics.distribution.percentiles-histogram.http.server.requests=true
info.app.name=utewedding-app
server.tomcat.accesslog.enabled=false
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
server.error.include-exception=false
logging.level.root=${LOG_LEVEL:info}
admin.enable-dev-entitlement-endpoint=${ENABLE_DEV_ENTITLEMENT_ENDPOINT:false}
public-cache.max-age=${PUBLIC_CACHE_MAX_AGE:60}
