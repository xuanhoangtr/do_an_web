# Cấu hình Spring Boot 3.3 - UTEWedding
spring.application.name=utewedding-app
server.port=8080

# Cấu hình Cơ sở dữ liệu PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/utewedding_db
spring.datasource.username=utewedding_user
spring.datasource.password=utewedding_secret_2026
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Flyway Migration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# Cấu hình Đối tác Vận chuyển Giao Hàng Nhanh (GHN) API v2
utewedding.shipping.mode=ghn-carrier-integrated
ghn.api.token=GHN_TEST_TOKEN_2026_SANDBOX
ghn.api.shop-id=198425
ghn.api.base-url=https://dev-online-gateway.ghn.vn/shiip/public-api
ghn.api.expected-delivery-days=3

# Cấu hình Gửi Email OTP Xác thực
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=noreply.utewedding@gmail.com
spring.mail.password=app_specific_password_2026
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
utewedding.auth.otp-expiry-minutes=5

# Cấu hình Lưu trữ Media & Thiệp cưới
utewedding.upload.dir=./uploads/wedding
utewedding.upload.max-file-size=10MB

# Cấu hình Cổng thanh toán VNPay Sandbox
vnpay.tmn-code=UTEWED26
vnpay.hash-secret=SECRET_KEY_VNPAY_SANDBOX_2026
vnpay.pay-url=https://sandbox.vnpayment.vn/paymentv2/vpcpay.html
vnpay.return-url=http://localhost:8080/payments/vnpay-return

# Cấu hình Ví MoMo Sandbox
momo.partner-code=MOMO_PARTNER_2026
momo.access-key=MOMO_ACCESS_KEY_2026
momo.secret-key=MOMO_SECRET_KEY_2026
momo.endpoint=https://test-payment.momo.vn/v2/gateway/api/create

# Cấu hình Realtime WebSocket STOMP Broker
utewedding.websocket.endpoint=/ws/utewedding
utewedding.websocket.app-prefix=/app
utewedding.websocket.topic-prefix=/topic,/queue

# Cấu hình Quyết toán Doanh thu & Đối soát Vendor
utewedding.finance.settlement.cycle=SEMI_MONTHLY
utewedding.finance.settlement.auto-freeze-threshold=50000000
utewedding.finance.payout.batch-cron=0 0 2 1,16 * ?
